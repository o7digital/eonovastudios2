# Inside the existing o7-proxy default server listening on 8080.
location = /eon2/chat {
    set $eon2_gateway http://eon2-olivia-gateway:3099;
    rewrite ^ /chat break;
    proxy_pass $eon2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Visitor-IP $http_x_visitor_ip;
    proxy_read_timeout 65s;
    client_max_body_size 16k;
}
