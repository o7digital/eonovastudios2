<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site en construction</title>
  <meta name="description" content="Notre site est actuellement en construction." />
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --fg: #101010;
      --muted: #5a5a5a;
      --card: #ffffff;
      --border: #e6e6e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Arial", sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 60%);
      color: var(--fg);
      padding: 24px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Site en construction</h1>
    <p>Nous préparons une nouvelle version. Revenez bientôt.</p>
  </main>
</body>
</html>
